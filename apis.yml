aid: synthetic-genomics
name: Viridos
description: >-
  Viridos, founded in 2005 as Synthetic Genomics, Inc. by J. Craig Venter and Hamilton Smith and
  renamed Viridos in September 2021, was a La Jolla, California synthetic-biology company that
  engineered microalgae genomes to produce low-carbon-intensity biofuels, running its algal biofuel
  program as a long-term research partnership with ExxonMobil. The company never published an API,
  a developer portal, or any machine-readable contract; its only public developer surface was a
  GitHub organization holding two first-party open-source projects - the AGPL-licensed sgidspace
  deep-learning protein annotation library and a sensor calibration app - alongside seven forks of
  third-party tools. Viridos filed for Chapter 11 bankruptcy in the District of Delaware on
  2025-04-14, sold substantially all of its algae biofuel technology to Breakthrough Energy
  Ventures II, L.P., and the case was dismissed on 2025-11-26. Its website has served no content
  since roughly October 2025.
