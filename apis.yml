x-notes:
  website-pointer-removed: >-
    The stub carried type Website pointing at https://forgeglobal.com/synthetic-genomics_stock/.
    Forge Global is a secondary-market trading venue, not Viridos, so that URL is not the company's
    web presence and has been retyped as SecondaryMarketListing (roadmap#56). No Website pointer is
    emitted in its place: the company's own domain, viridos.com, returns "403 | Access blocked" on
    every path from a SiteGround default vhost behind a certificate that does not cover the domain.
  legacy-domain-warning: >-
    syntheticgenomics.com returns HTTP 200 but is NOT this company. The legacy domain was dropped
    and now hosts a Canadian online-casino affiliate site on Cloudflare. It must never be wired as
    a Website or Blog pointer for this profile.
  no-wellknown-pointer: >-
    well-known/synthetic-genomics-well-known.yml records the probe of 20 /.well-known and
    contract-discovery paths across viridos.com and dspace.bio. Every one returned 403, so no
    WellKnown or SecurityTxt pointer is emitted - the file documents an absence, not a surface.
  not-sgi-dna: >-
    SGI-DNA, the DNA synthesis instrument business separated from Synthetic Genomics (later Codex
    DNA / Telesis Bio), is a different company. Do not attribute its products or APIs here.
